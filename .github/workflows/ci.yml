name: Playwright CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  playwright-tests:
    name: Playwright tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker info

      - name: Build Docker image
        run: |
          set -e

          echo "=== Build Docker image ==="
          docker build -f task_3/Dockerfile -t infotecs-playwright .

      - name: DNS check
        run: |
          set -e

          echo "=== DNS check ==="

          docker run --rm infotecs-playwright \
            node -e "require('dns').lookup('infotecs.ru', (e,a,f) => {
              console.log(e || {address:a,family:f});
              process.exit(e ? 1 : 0)
            })"

      - name: HTTPS check
        run: |
          set -e

          echo "=== HTTPS check ==="

          docker run --rm infotecs-playwright \
            node -e "fetch('https://infotecs.ru')
              .then(r => {
                console.log('HTTP:', r.status);
                process.exit(0);
              })
              .catch(e => {
                console.error(e);
                process.exit(1);
              })"

      - name: Create test container
        run: |
          set -e
      
          echo "=== Cleanup old container ==="
      
          docker rm -f infotecs-playwright-test 2>/dev/null || true
      
          echo "=== Create test container ==="
      
          docker create \
            --name infotecs-playwright-test \
            -e CI=true \
            infotecs-playwright

      - name: Run Playwright
        run: |
          set +e
      
          echo "=== Run Playwright ==="
      
          docker run \
            --name infotecs-playwright-test \
            -e CI=true \
            infotecs-playwright
      
          TEST_EXIT_CODE=$?
      
          set -e
      
          echo "Playwright exit code: $TEST_EXIT_CODE"
      
          mkdir -p playwright-report
          mkdir -p test-results
      
          docker cp \
            infotecs-playwright-test:/app/playwright-report/. \
            ./playwright-report/ || true
      
          docker cp \
            infotecs-playwright-test:/app/test-results/. \
            ./test-results/ || true
      
          docker rm -f infotecs-playwright-test || true
      
          echo "=== Final exit code: $TEST_EXIT_CODE ==="
      
          exit "$TEST_EXIT_CODE"

      - name: Save Playwright exit code
        if: always()
        run: |
          echo "Playwright container finished"

      - name: Copy Playwright report
        if: always()
        run: |
          mkdir -p playwright-report

          docker cp \
            infotecs-playwright-test:/app/playwright-report/. \
            ./playwright-report/ || true

      - name: Copy test results
        if: always()
        run: |
          mkdir -p test-results

          docker cp \
            infotecs-playwright-test:/app/test-results/. \
            ./test-results/ || true

      - name: Remove test container
        if: always()
        run: |
          docker rm -f infotecs-playwright-test || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Fail if Playwright failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1

  publish-image:
    name: Publish Docker image
    needs: playwright-tests
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker -f task_3/Dockerfile build \
            -t "${{ steps.image.outputs.name }}:${GITHUB_SHA::7}" \
            -t "${{ steps.image.outputs.name }}:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ steps.image.outputs.name }}:${GITHUB_SHA::7}"
          docker push "${{ steps.image.outputs.name }}:latest"
